name: Sync to Hugging Face Space

on:
  push:
    branches:
      - master

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push --force https://YOUR_HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/szamadesh/fintech-knowledge-bot master:main
